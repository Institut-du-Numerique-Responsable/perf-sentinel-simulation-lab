[package]
name = "seaorm-svc"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "=2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
lapin = "=4.12.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
reqwest-middleware = "0.5"
# shortcut: OpenTelemetry held on 0.32 (tracing-opentelemetry 0.33, axum-tracing-opentelemetry 0.39)
# because reqwest-tracing has no opentelemetry_0_33 feature yet and two otel versions break
# context propagation; upgrade once TrueLayer/reqwest-middleware#288 ships.
reqwest-tracing = { version = "0.7", features = ["opentelemetry_0_32"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
axum-tracing-opentelemetry = "0.39"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = true
