# perf-sentinel GitLab CI pipeline (lab fixture).
#
# Derived from docs/ci-templates/gitlab-ci.yml in the perf-sentinel
# repo. Differences vs the upstream template:
#   - PERF_SENTINEL_VERSION pinned to the upstream template's own default.
#     The seeded pipeline downloads that release binary from GitHub, so it
#     has to name a PUBLISHED version. scenarios/template-gitlab-ci asserts
#     the two pins agree, because a stale one here means the gate validates
#     a binary nobody ships.
#   - integration-tests dummy job that publishes test-traces.json so
#     the perf-sentinel job picks it up via dependencies
#   - dependencies: [integration-tests] uncommented on perf-sentinel
#   - Free-tier Pages block uncommented (used by the lab verify)
#   - Premium-tier Pages block left commented (out of scope)
#
# This file lives at artifacts/fixtures/ in the simulation lab and
# gets pushed verbatim to the perf-sentinel-template-test project on
# the in-cluster GitLab CE during make seed-gitlab-project.

stages:
  - test
  - perf-sentinel

variables:
  PERF_SENTINEL_VERSION: "0.26.0"
  PERF_SENTINEL_TRACES: "test-traces.json"
  PERF_SENTINEL_CONFIG: ".perf-sentinel.toml"

# Dummy integration-tests job: republishes the in-repo test-traces.json
# as an artifact so the perf-sentinel job can consume it via
# `dependencies:`. In a real project, replace this with a job that
# actually runs the integration suite and produces the trace file.
integration-tests:
  stage: test
  image: alpine:3.19
  script:
    - test -s "${PERF_SENTINEL_TRACES}"
    - echo "fixture in repo, republishing as artifact"
  artifacts:
    paths:
      - test-traces.json
    expire_in: 1 day

perf-sentinel:
  stage: perf-sentinel
  image: debian:bookworm-slim
  dependencies:
    - integration-tests
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates jq
    - |
      set -euo pipefail
      BASE_URL="https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/releases/download/v${PERF_SENTINEL_VERSION}"
      curl -sSLf -o perf-sentinel-linux-amd64 "${BASE_URL}/perf-sentinel-linux-amd64"
      curl -sSLf -o SHA256SUMS.txt            "${BASE_URL}/SHA256SUMS.txt"
      # Verify integrity before executing. Fails the job if the binary was
      # tampered with or the release is corrupted.
      grep 'perf-sentinel-linux-amd64' SHA256SUMS.txt | sha256sum -c -
      # Install under the project bin/ rather than /usr/local/bin so the
      # template works without elevated privileges on hardened runners.
      mkdir -p "${CI_PROJECT_DIR}/bin"
      install -m 0755 perf-sentinel-linux-amd64 "${CI_PROJECT_DIR}/bin/perf-sentinel"
      export PATH="${CI_PROJECT_DIR}/bin:${PATH}"
      perf-sentinel --version
  script:
    # SARIF artifact for archive and inspection.
    - |
      "${CI_PROJECT_DIR}/bin/perf-sentinel" analyze \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --format sarif \
        > findings.sarif
    # JSON report for downstream tooling and the Code Quality conversion.
    - |
      "${CI_PROJECT_DIR}/bin/perf-sentinel" analyze \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --format json \
        > perf-sentinel-report.json || true
    # Convert findings to GitLab Code Quality format.
    - |
      jq '[
        .findings[] | {
          description: ("[" + .type + "] " + .suggestion),
          fingerprint: (.trace_id + "-" + .type + "-" + .source_endpoint),
          severity: (
            if .severity == "critical" then "critical"
            elif .severity == "warning" then "major"
            else "info" end
          ),
          location: {
            path: (.code_location.filepath // "unknown"),
            lines: { begin: (.code_location.lineno // 1) }
          }
        }
      ]' perf-sentinel-report.json > gl-code-quality-report.json
    # Re-run with --ci to enforce the quality gate. Exit code 1 if any
    # threshold is breached.
    - |
      "${CI_PROJECT_DIR}/bin/perf-sentinel" analyze \
        --ci \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --format json > /dev/null
  artifacts:
    when: always
    paths:
      - findings.sarif
      - perf-sentinel-report.json
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      allow_failure: true

# Free-tier compatible Pages deployment on the default branch only.
# Publishes baseline.json and an interactive HTML snapshot at the
# project Pages root. The lab verify asserts the artifact `public/`
# directory rather than fetching ${CI_PAGES_URL}, since the in-cluster
# GitLab CE has no Ingress (Pages serving is best-effort).
perf-sentinel-pages-simple:
  stage: perf-sentinel
  image: debian:bookworm-slim
  dependencies:
    - integration-tests
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - |
      set -euo pipefail
      BASE_URL="https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/releases/download/v${PERF_SENTINEL_VERSION}"
      curl -sSLf -o perf-sentinel-linux-amd64 "${BASE_URL}/perf-sentinel-linux-amd64"
      curl -sSLf -o SHA256SUMS.txt            "${BASE_URL}/SHA256SUMS.txt"
      grep 'perf-sentinel-linux-amd64' SHA256SUMS.txt | sha256sum -c -
      mkdir -p "${CI_PROJECT_DIR}/bin"
      install -m 0755 perf-sentinel-linux-amd64 "${CI_PROJECT_DIR}/bin/perf-sentinel"
      "${CI_PROJECT_DIR}/bin/perf-sentinel" --version
  script:
    # Renders the trace file straight to HTML. Since 0.5.14 the binary
    # honors its --help contract and auto-detects Jaeger inputs on the
    # report path, no analyze-then-report dance is needed. The raw
    # analyze JSON is also archived next to the HTML so downstream
    # tooling (baseline diffing, dashboards, custom reports) can
    # consume it without re-parsing the HTML.
    - |
      set -euo pipefail
      mkdir -p public/perf-sentinel-reports
      "${CI_PROJECT_DIR}/bin/perf-sentinel" report \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --output public/index.html
      "${CI_PROJECT_DIR}/bin/perf-sentinel" analyze \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --format json \
        > public/perf-sentinel-reports/baseline.json
  artifacts:
    paths: [public]
  pages: true
  environment:
    name: pages/default
    url: "${CI_PAGES_URL}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
