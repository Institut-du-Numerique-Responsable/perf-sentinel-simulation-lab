---
# Kepler mock for the lab. The real Kepler exporter (v0.10+) reads
# RAPL through powercap and splits it by CPU time, so it only emits
# real readings on Linux hosts that expose RAPL, which the lab nodes
# do not. This Python stdlib
# mock stands in for a real Kepler DaemonSet and lets the daemon
# exercise its `[green.kepler]` Prometheus scrape path. The mock
# exposes only `kepler_container_cpu_joules_total`, the single metric
# perf-sentinel consumes in `metric_kind = "container"` mode (canonical
# name baked at `crates/sentinel-core/src/score/kepler/config.rs:37`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kepler-mock-script
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
data:
  app.py: |
    """Minimal Kepler mock exposing /metrics in Prometheus format.

    Cumulative joule counters per container_name, advanced by a
    background thread on a wall-clock cadence independent of the HTTP
    scrape rate. The real Kepler exporter updates its counters on its
    own monitor interval regardless of who scrapes them; matching that
    semantic means a second scraper (e.g. a Prometheus ServiceMonitor
    layered on top of the daemon's direct scrape) cannot inflate the
    visible rate.

    Only the `metric_kind = "container"` variant
    (`kepler_container_cpu_joules_total`) is exposed. This is the
    Kepler v0.10+ canonical name with the `_cpu_` infix. The pre-v0.10
    name `kepler_container_joules_total` lives in `kepler-mock-legacy.yaml`
    as a negative fixture for the daemon's zero-sample safety net.
    `process_package` and `process_dram` are not implemented; configure
    the daemon accordingly.
    """
    import sys
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TICK_INTERVAL_SEC = 5

    CONTAINERS = [
        # (container_name as exposed by Kepler, joules added per tick)
        ("order-svc", 12.0),
        ("payment-svc", 18.0),
        ("notification-svc", 7.0),
    ]

    STARTUP_EPOCH = time.time()
    COUNTERS = {name: 0.0 for name, _ in CONTAINERS}
    COUNTERS_LOCK = threading.Lock()


    def tick_loop():
        while True:
            time.sleep(TICK_INTERVAL_SEC)
            with COUNTERS_LOCK:
                for name, delta in CONTAINERS:
                    COUNTERS[name] += delta


    def snapshot_counters():
        with COUNTERS_LOCK:
            return dict(COUNTERS)


    def render_metrics():
        snapshot = snapshot_counters()
        lines = [
            "# HELP kepler_container_cpu_joules_total Cumulative joules per container - mocked",
            "# TYPE kepler_container_cpu_joules_total counter",
        ]
        for name, _ in CONTAINERS:
            lines.append(
                f'kepler_container_cpu_joules_total{{container_name="{name}"}} {snapshot[name]:.1f}'
            )
        return "\n".join(lines) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                body = render_metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/healthz":
                uptime = int(time.time() - STARTUP_EPOCH)
                body = f"ok uptime={uptime}s\n".encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_error(404, "Not Found")

        def log_message(self, fmt, *args):
            sys.stderr.write(f"{self.address_string()} {fmt % args}\n")


    if __name__ == "__main__":
        threading.Thread(target=tick_loop, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 9102), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: kepler-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kepler-mock
  ports:
    - name: http
      port: 9102
      targetPort: 9102
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kepler-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kepler-mock
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72  # 3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/scripts/app.py"]
          ports:
            - name: http
              containerPort: 9102
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: script
          configMap:
            name: kepler-mock-script
            items:
              - key: app.py
                path: app.py
