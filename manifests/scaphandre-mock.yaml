---
# Scaphandre mock for the lab. RAPL is not accessible on Apple Silicon
# nor on most cloud runners, so this Python stdlib mock stands in for
# a real Scaphandre exporter and lets the daemon exercise its
# `[green.scaphandre]` scrape path. The mock exposes only
# `scaph_process_power_consumption_microwatts`, the single metric
# perf-sentinel actually consumes (cf upstream parser.rs:39).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scaphandre-mock-script
  namespace: observability
  labels:
    app.kubernetes.io/name: scaphandre-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
data:
  app.py: |
    """Minimal Scaphandre mock exposing /metrics in Prometheus format.

    Generates deterministic per-process power values by hashing
    (exe, pid). Stdlib only: no Flask, no pip install at startup, so
    the pod boots in seconds and survives the lab zero-trust
    NetworkPolicy without an egress rule.

    Label shape mirrors the real Scaphandre exporter (cf
    perf-sentinel docs/CONFIGURATION.md "Why both exe_contains and
    cmdline_contains"): `exe` is the absolute path of the runtime
    binary, and `cmdline` is argv concatenated WITHOUT separators
    (Scaphandre joins argv tokens with no space), so configs that
    rely on `cmdline_contains` must target a substring of that
    concatenated form (typically the jar/dll filename).
    """
    import hashlib
    import os
    import sys
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # One process per service running in the lab. The 3 Java baseline
    # services (order, payment, notification) all share the OpenJDK 25
    # runtime baked into gcr.io/distroless/java25:nonroot
    # (services/shared-dockerfile/Dockerfile). The 15 multistack
    # services (quarkus, mutiny, helidon-se/mp, ktor, dotnet, diesel, seaorm,
    # nest, django, fastapi, go, rails, laravel, symfony) each expose a
    # fictional process whose
    # exe matches the runtime path their container would bake. Temurin
    # (eclipse-temurin:25-jdk-alpine) is the BUILD stage only, never
    # the runtime, and the Java exe paths here are OpenJDK distroless.
    # cmdline values are concatenated without separators, mirroring the
    # real Scaphandre behaviour documented in docs/CONFIGURATION.md
    # "Why both exe_contains and cmdline_contains".
    PROCESSES = [
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/order-service.jar",        "pid": 1234},
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/payment-service.jar",      "pid": 1235},
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/notification-service.jar", "pid": 1236},
        # Multistack services (5 Java-based: quarkus, mutiny, helidon-se, helidon-mp, ktor)
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/quarkus-svc.jar",          "pid": 1240},
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/mutiny-svc.jar",           "pid": 1241},
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/helidon-se-svc.jar",       "pid": 1242},
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/helidon-mp-svc.jar",       "pid": 1243},
        {"exe": "/usr/lib/jvm/java-25-openjdk-amd64/bin/java", "cmdline": "java-jar/app/ktor-svc.jar",             "pid": 1244},
        # Multistack: .NET (chiseled Ubuntu Noble)
        {"exe": "/usr/share/dotnet/dotnet",                    "cmdline": "dotnet/app/dotnet-svc.dll",             "pid": 2240},
        # Multistack: Rust (static binary per service)
        {"exe": "/usr/local/bin/diesel-svc-bin",               "cmdline": "diesel-svc-bin",                         "pid": 3240},
        {"exe": "/usr/local/bin/seaorm-svc-bin",               "cmdline": "seaorm-svc-bin",                         "pid": 3241},
        # Multistack: Node (distroless nodejs24)
        {"exe": "/usr/local/bin/node",                         "cmdline": "node/app/dist/main.js-nest-svc",         "pid": 4240},
        # Multistack: Python (distroless python3)
        {"exe": "/usr/bin/python3.13",                         "cmdline": "python3-mmanage.py-runserver-django-svc","pid": 5240},
        {"exe": "/usr/bin/python3.13",                         "cmdline": "python3-muvicorn-app.main:app-fastapi-svc","pid": 5241},
        # Multistack: Go (static binary)
        {"exe": "/usr/local/bin/go-svc-bin",                   "cmdline": "go-svc-bin",                             "pid": 6240},
        # Multistack: Ruby (slim-bookworm, puma)
        {"exe": "/usr/local/bin/ruby",                         "cmdline": "rubypuma/app/config.ru-rails-svc",       "pid": 7240},
        # Multistack: PHP (cli built-in server; exe matches process_map bin/php)
        {"exe": "/usr/local/bin/php",                          "cmdline": "php-Sserver.php-laravel-svc",            "pid": 7241},
        {"exe": "/usr/local/bin/php",                          "cmdline": "php-Sserver.php-symfony-svc",            "pid": 7242},
    ]

    INSTANCE_LABEL = os.environ.get("SCAPHANDRE_MOCK_INSTANCE", "scaphandre-mock")
    STARTUP_EPOCH = time.time()


    def hash_to_power_microwatts(exe, pid):
        # SHA-256 of "exe:pid" -> first 8 bytes as u64 -> [1W, 50W].
        digest = hashlib.sha256(f"{exe}:{pid}".encode()).digest()[:8]
        n = int.from_bytes(digest, "big")
        return 1_000_000 + (n % 49_000_000)


    def render_metrics():
        lines = [
            "# HELP scaph_process_power_consumption_microwatts Per-process power consumption (uW) - mocked",
            "# TYPE scaph_process_power_consumption_microwatts gauge",
        ]
        for proc in PROCESSES:
            power_uw = hash_to_power_microwatts(proc["exe"], proc["pid"])
            labels = (
                f'exe="{proc["exe"]}",'
                f'cmdline="{proc["cmdline"]}",'
                f'pid="{proc["pid"]}",'
                f'instance="{INSTANCE_LABEL}"'
            )
            lines.append(
                f"scaph_process_power_consumption_microwatts{{{labels}}} {power_uw}"
            )
        return "\n".join(lines) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                body = render_metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/healthz":
                uptime = int(time.time() - STARTUP_EPOCH)
                body = f"ok uptime={uptime}s\n".encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_error(404, "Not Found")

        def log_message(self, fmt, *args):
            sys.stderr.write(f"{self.address_string()} {fmt % args}\n")


    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 9100), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: scaphandre-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: scaphandre-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scaphandre-mock
  ports:
    - name: http
      port: 9100
      targetPort: 9100
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaphandre-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: scaphandre-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaphandre-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaphandre-mock
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          # python:3.13-alpine pinned by digest. Resolve via
          # `docker buildx imagetools inspect python:3.13-alpine
          # --format '{{json .Manifest.Digest}}'` on bump.
          image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72  # 3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/scripts/app.py"]
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9100
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9100
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: script
          configMap:
            name: scaphandre-mock-script
            items:
              - key: app.py
                path: app.py
