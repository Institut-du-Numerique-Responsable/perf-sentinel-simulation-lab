# 4.D.sexdecies ingress on the daemon's HTTP port for Grafana's Infinity
# datasource.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perf-sentinel-daemon-allow-grafana
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 14318
---
# 4.D.septdecies Grafana egress to Prometheus. The overview dashboard
# (manifests/grafana-dashboards/perf-sentinel-overview.json) is queried by
# Grafana's backend, so without this every one of its panels times out,
# including its `Compatibility` badge, while the scenario's own panel-render
# check keeps passing because that one talks to Prometheus directly over a
# port-forward. Both halves are needed: observability is default-deny on
# Ingress AND Egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-prometheus-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
---
# 4.D.duodevicies the ingress half of the rule above. `allow-prometheus-scrape`
# opens every pod to traffic coming FROM Prometheus, which is the opposite
# direction and does not cover this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-allow-grafana
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
---
# 4.E perf-sentinel daemon egress to Electricity Maps.
# Cilium-only: toFQDNs requires the Cilium DNS proxy. With Calico,
# replace with CIDR-based egress (see docs/NETWORK-POLICIES.md).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: perf-sentinel-emaps-egress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  egress:
    - toFQDNs:
        - matchName: "api.electricitymaps.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # DNS resolution path: Cilium intercepts on UDP/53, but the
    # destination is still kube-dns in kube-system.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
---
# 4.E.bis Grafana egress to the plugin catalog. GF_PLUGINS_PREINSTALL_SYNC
# (grafana.plugins in the helm values) makes Grafana download the Infinity
# plugin at EVERY start: the plugins dir is the chart's storage emptyDir. The
# catalog on grafana.com answers 302 to storage.googleapis.com, so both hosts
# are listed. Cilium-only: toFQDNs requires the Cilium DNS proxy. With Calico,
# replace with CIDR-based egress (see docs/NETWORK-POLICIES.md).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-plugin-egress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toFQDNs:
        - matchName: "grafana.com"
        - matchName: "storage.googleapis.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
---
# 4.F GitLab runner egress to GitHub + GitLab registries. The chart's
# gitlab-runner sub-chart sets `app=<release>-<chart>` on its pod, which
# resolves to `gitlab-gitlab-runner` here (release=gitlab, chart name
# gitlab-runner). The recommended `app.kubernetes.io/name` label family
# is not emitted, so we match the runner via its actual `app` label
# plus `release=gitlab` for defense in depth.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitlab-runner-egress
  namespace: gitlab-ce
spec:
  endpointSelector:
    matchLabels:
      app: gitlab-gitlab-runner
      release: gitlab
  egress:
    - toFQDNs:
        - matchPattern: "*.github.com"
        - matchName: "github.com"
        - matchName: "registry.gitlab.com"
        - matchName: "objects.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
---
# 4.G.egress Prometheus needs egress to every namespace it scrapes.
# The default-deny-all in observability blocks Prometheus from
# initiating connections, so we explicitly authorize it to reach the
# 4 lab namespaces plus kube-system (kube-state-metrics + kubelet
# scrape). Restricted to common metric ports.
#
# Adding a new exporter on a non-listed port? Append the port here
# AND on its target namespace's allow-prometheus-scrape rule, then
# `make apply-network-policies`. Without this, the scrape silently
# stays in `up=0` with a connection-refused error in the Prometheus
# target page, with no NetworkPolicy denial visible in the kubelet
# events.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 14318
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 9252
        - protocol: TCP
          port: 9187
        # Alertmanager. Prometheus both pushes its firing alerts here and
        # scrapes it. Leave this out and the push fails silently: no
        # NetworkPolicy event, no Prometheus error worth the name, just an
        # Alertmanager that never receives anything and an incident chain that
        # dies one hop upstream of perf-sentinel.
        - protocol: TCP
          port: 9093
---
# 4.D.quinquies Alertmanager delivers incidents to the perf-sentinel daemon.
# perf-sentinel 0.22.0 ships ready-made rules and an AlertmanagerConfig whose
# receiver posts to POST /api/incidents, so Alertmanager reaching the daemon is
# part of this lab's baseline topology rather than one scenario's fixture. Both
# halves are needed: `observability` is default-deny on Ingress AND Egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perf-sentinel-daemon-allow-alertmanager
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 14318
---
# 4.D.quinquies-bis the egress half of the rule above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-daemon-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: perf-sentinel-daemon
      ports:
        - protocol: TCP
          port: 14318
---
# 4.G Prometheus scrapes targets across namespaces. Authorize the
# Prometheus pod (label app.kubernetes.io/name=prometheus, instance=
# kube-prometheus-stack-prometheus) to ingress-scrape every pod with
# a ServiceMonitor in shop, db, gitlab-ce, observability. Repeated
# per namespace because the CNI namespaceSelector + podSelector
# combination is the source filter, not the target.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: db
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: gitlab-ce
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
---
# 4.H GitLab CE internal mesh. The chart uses two label families:
# bitnami sub-charts (postgresql, redis) expose
# `app.kubernetes.io/instance=gitlab` (no `release` label) while
# gitlab-org components (webservice, sidekiq, gitaly, kas, minio,
# toolbox, etc.) expose `app=<bare-component>` plus `release=gitlab`.
# A few components break the bare-name rule and ship with a `gitlab-`
# prefix (gitlab-shell, gitlab-pages, gitlab-exporter), and the runner
# sub-chart goes one further with `app=gitlab-gitlab-runner` (release
# name + chart name). The `release=gitlab` label is the only stable
# common selector across the gitlab-org family, so we use it here to
# allow the internal mesh, and rely on per-component `app=` selectors
# elsewhere when we need to single out a specific pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gitlab-internal
  namespace: gitlab-ce
spec:
  podSelector:
    matchLabels:
      release: gitlab
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              release: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: gitlab
  egress:
    - to:
        - podSelector:
            matchLabels:
              release: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: gitlab
---
# 4.H.bis postgres + redis sub-charts use app.kubernetes.io/instance
# instead of release. Cover them explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gitlab-bitnami-internal
  namespace: gitlab-ce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: gitlab
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              release: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: gitlab
  egress:
    - to:
        - podSelector:
            matchLabels:
              release: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: gitlab
---
# 4.H.runner runner build pods need egress to webservice (git fetch),
# gitaly (sometimes direct), and DNS. The build pods are spawned by
# the runner controller with dynamic labels (no `release=gitlab`
# nor `instance=gitlab`), so the chart-mesh policies do not match
# them. This rule covers any pod in gitlab-ce that lacks those
# labels (i.e., build pods only) and authorizes egress to the
# chart-mesh and to GitHub release downloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitlab-build-pods-egress
  namespace: gitlab-ce
spec:
  podSelector:
    matchExpressions:
      - key: release
        operator: NotIn
        values: [gitlab]
      - key: app.kubernetes.io/instance
        operator: NotIn
        values: [gitlab]
  policyTypes: [Egress]
  egress:
    # Reach the chart's webservice, gitaly, redis, postgres pods.
    - to:
        - podSelector:
            matchLabels:
              release: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: gitlab
    # DNS so the runner build pods can resolve hostnames in their
    # before_script (apt-get update, sha256sum download, etc.).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 4.H.runner.fqdn build pods download perf-sentinel binaries from
# github.com via curl. Authorize the FQDN egress on top of the chart
# mesh so the script section of the perf-sentinel job succeeds.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitlab-build-pods-fqdn-egress
  namespace: gitlab-ce
spec:
  endpointSelector:
    matchExpressions:
      - key: release
        operator: NotIn
        values: [gitlab]
      - key: app.kubernetes.io/instance
        operator: NotIn
        values: [gitlab]
  egress:
    - toFQDNs:
        - matchPattern: "*.github.com"
        - matchName: "github.com"
        - matchName: "objects.githubusercontent.com"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.debian.org"
        - matchName: "deb.debian.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
---
# 4.I GitLab webservice ingress from the host (port-forward) and from
# the in-cluster runner registration path. The kubectl port-forward
# source IP is the API server's local proxy, which appears as the
# control-plane node IP. We allow ingress on workhorse port 8181
# from every namespace's pods (the runner pod can be in gitlab-ce
# or another ns, depending on chart layout).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitlab-webservice-ingress
  namespace: gitlab-ce
spec:
  podSelector:
    matchLabels:
      app: webservice
  policyTypes: [Ingress]
  ingress:
    # Internal: same-namespace pods (runner, sidekiq, gitaly callbacks).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 8080
    # External: kubectl port-forward arrives via apiserver, which Cilium
    # tags as host-network. Accept on the workhorse port. Calico users
    # may need to extend with a 0.0.0.0/0 ipBlock entry if they do not
    # allow host-network ingress by default.
    - ports:
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 8080
---
# 4.J postgres-exporter, deployed by scenarios/grafana-dashboard/postgres-exporter.yaml.
# Egress to Postgres on 5432 for the DSN connection. DNS is already
# covered by the namespace-wide allow-dns-egress (4.B above) and the
# Prometheus scrape ingress is already covered by allow-prometheus-scrape
# in db (broad podSelector: {} matches postgres-exporter on port 9187).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-exporter-egress
  namespace: db
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# 4.J.bis postgres ingress allow from postgres-exporter, mirrors
# postgres-allow-shop (4.C.bis) but for the exporter pod in the same
# namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-exporter
  namespace: db
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-exporter
      ports:
        - protocol: TCP
          port: 5432
---
# 4.H CI job pods need Maven Central. The GitLab Kubernetes executor creates a
# fresh pod per job, and those pods carry none of the labels 4.F selects on, so
# they fall through to `default-deny-all` and reach nothing, not a package
# mirror, not a dependency repository. Any real Java pipeline in this cluster
# therefore fails at dependency resolution.
#
# Deliberately narrow on the DESTINATION rather than on the source: the selector
# is namespace-wide because job pods are unlabelled, but the only thing opened is
# Maven Central over 443. Nothing else in gitlab-ce gains egress it did not have.
#
# Scenario that depends on it: scenarios/ci-e2e-gitlab.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitlab-ci-jobs-maven-egress
  namespace: gitlab-ce
spec:
  endpointSelector: {}
  egress:
    - toFQDNs:
        - matchName: "repo.maven.apache.org"
        - matchName: "repo1.maven.org"
        - matchPattern: "*.maven.apache.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
