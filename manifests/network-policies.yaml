# `[green.scaphandre]` scrape path. Scoped to the in-cluster mock
# Service in the same namespace, port 9100. Without this rule, the
# zero-trust default-deny silently drops the scrape and the mock
# scenario sub-test 5 fails with a stagnant gauge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perf-sentinel-daemon-scaphandre-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
