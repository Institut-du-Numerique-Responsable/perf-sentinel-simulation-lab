---
# 4.B.bis kube-apiserver egress. Many in-cluster components
# (kube-state-metrics, Grafana, OTel collector with the k8sattributes
# processor, Prometheus, GitLab kas) call the API server for service
# discovery or k8s metadata enrichment. The apiserver runs in the
# host network on 6443, not as a regular pod, so we authorize the
# Cilium entity. Calico fallback would use ipBlock with the node IPs.
#
# Note for prod-shape deployments: `endpointSelector: {}` is broad
# (any pod in the namespace can call the API). In a real
# production cluster, narrow this to the specific service accounts
# or labels that legitimately need apiserver access. Acceptable as
# a lab default because the namespace already filters to known
# operators (kube-prometheus-stack, OTel, GitLab).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
  namespace: observability
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
  namespace: gitlab-ce
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
        - ports:
            - port: "443"
              protocol: TCP
---
# 4.C shop services: egress to Postgres + OTel collector. Match by the
# `app.kubernetes.io/part-of: perf-sentinel-lab` label that the 3 Java
# service Helm charts inject on every pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-services-egress
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: perf-sentinel-lab
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
---
# 4.C.intra shop intra-namespace traffic. The k6 load jobs spawned
# by validate-findings.sh do not carry the `perf-sentinel-lab`
# label and would otherwise be denied. Allow any pod in shop to
# reach the lab service port range, plus service-to-service HTTP
# calls (order calls notification, etc.) for the n+1-http and
# chatty scenarios. Range 8080-8097 covers the 3 Java baseline
# services (8080-8082) and the 15 multistack services (8083-8097),
# see docs/MULTISTACK.md for the per-service mapping.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-intra-namespace
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: perf-sentinel-lab
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
      ports:
        - protocol: TCP
          port: 8080
          endPort: 8097
---
# 4.C.bis-egress allow shop pods (including k6 jobs without lab
# label) to reach the lab services intra-namespace. This is broader
# than the `app.kubernetes.io/part-of` selector because k6 pods
# are ephemeral and not labeled. Range 8080-8097 mirrors the
# ingress rule above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-intra-egress
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
      ports:
        - protocol: TCP
          port: 8080
          endPort: 8097
---
# 4.C.bis ingress on Postgres limited to the lab's shop pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-shop
  namespace: db
spec:
