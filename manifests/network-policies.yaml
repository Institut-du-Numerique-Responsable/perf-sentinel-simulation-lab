# 4.D.octies-bis daemon egress to the real upstream Kepler exporter
# (opt-in harness in manifests/kepler-exporter.yaml). The real
# exporter lives in its own `kepler` namespace and listens on TCP
# 28282 per upstream defaults, so the rule is cross-namespace and
# uses the system-managed `kubernetes.io/metadata.name` label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perf-sentinel-daemon-kepler-exporter-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-daemon
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kepler
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kepler-exporter
      ports:
        - protocol: TCP
          port: 28282
# Symmetric ingress on the kepler-exporter pod ships with the opt-in
# harness in manifests/kepler-exporter.yaml so the `kepler` namespace
# exists when the policy is created, applying it from this file would
# fail `make up-cni` on a default lab.
---
