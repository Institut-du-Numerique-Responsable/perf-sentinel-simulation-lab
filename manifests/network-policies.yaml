# Zero-trust NetworkPolicy for the perf-sentinel simulation lab.
#
# Strategy: deny-all by default in every namespace, then explicitly
# allow the connections we know are legitimate. CNI must be Cilium or
# Calico (Flannel ignores these resources silently). The CiliumNetwork
# Policy entries in the lower half use FQDN-based egress and require
# Cilium's DNS proxy. If you fall back to Calico, replace those
# entries with CIDR-based egress (see docs/NETWORK-POLICIES.md).
---
# 4.A.1 default-deny in shop
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 4.A.2 default-deny in db
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: db
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 4.A.3 default-deny in observability
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 4.A.4 default-deny in gitlab-ce
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: gitlab-ce
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 4.A.5 default-deny in messaging
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: messaging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 4.B DNS egress to kube-system kube-dns from every namespace.
# Without this, no pod can resolve cluster-internal or external
# hostnames. Repeated per namespace because NetworkPolicy is namespaced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: db
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: gitlab-ce
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
