---
# PerfSentinelHub: the collection tier between the daemon and the IDE plugins.
#
# Deployed from a RAW manifest rather than the upstream Helm chart on purpose.
# The chart's _helpers.tpl requires `image.digest` to match
# `^sha256:[0-9a-f]{64}$`, which a locally built image imported with
# `k3d image import` does not have. The lab already treats the daemon the same
# way and validates charts separately (chart-prometheusrule-pdb,
# chart-disclose-persistence).
#
# The pin below is the published Hub image, by index digest, the same way the
# daemon manifest pins perf-sentinel. Pre-release validation goes through
# `make seed-hub-local`, which builds from ~/RiderProjects/PerfSentinelHub,
# imports the image and rewrites this line in the working tree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: perf-sentinel-hub-config
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-hub
    app.kubernetes.io/part-of: perf-sentinel-lab
data:
  # ASP.NET Core JSON configuration, mounted over
  # /app/appsettings.Production.json. Same shape the upstream Helm chart
  # renders: everything except the two credentials lives here, because an
  # array of objects does not express well as flattened Hub__Sources__0__*
  # environment variables.
  #
  # ResolutionGrace at 15 minutes: long enough that a scenario restarting the
  # shared daemon does not flip every finding to likely_resolved, short enough
  # that a deliberately quiet endpoint reaches it inside one full lab run. The
  # status transition itself is proven in an isolated namespace with a
  # seconds-scale grace (scenarios/hub-derived-status).
  appsettings.Production.json: |
    {
      "Hub": {
        "DatabasePath": "/data/hub.db",
        "PollInterval": "00:01:00",
        "HttpTimeout": "00:00:10",
        "MaxConcurrentPolls": 4,
        "Retention": "180.00:00:00",
        "ResolutionGrace": "00:15:00",
        "DefaultReadLimit": 1000,
        "MaxReadLimit": 10000,
        "Analysis": {
          "EngineBinaryPath": "/app/perf-sentinel",
          "ReportDirectory": "/data/reports"
        },
        "Sources": [
          {
            "Id": "lab-daemon",
            "Name": "lab shared daemon",
            "Environment": "lab",
            "BaseUrl": "http://perf-sentinel-daemon.observability.svc.cluster.local:14318",
            "AuthHeaderName": "X-API-Key"
          }
        ]
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: perf-sentinel-hub-data
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-hub
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  # ReadWriteOnce and a single replica are not a knob: SQLite has one writer,
  # and the findings timeline is the Hub's only non-reconstructible state.
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: perf-sentinel-hub
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-hub
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: perf-sentinel-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-sentinel-hub
  namespace: observability
  labels:
    app.kubernetes.io/name: perf-sentinel-hub
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: perf-sentinel-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perf-sentinel-hub
        app.kubernetes.io/part-of: perf-sentinel-lab
    spec:
      automountServiceAccountToken: false
      # UID 1654 matches the Hub Dockerfile's `USER 1654:1654`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: perf-sentinel-hub
          image: ghcr.io/institut-du-numerique-responsable/perf-sentinel-hub@sha256:6dd0b2b4531c422d160d44e7e192a436f3929d24a10853bd5efa18dba6941baa  # 0.10.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # The only two secrets the Hub takes. The import key authenticates
            # the daemon's push; the same Secret is mounted as a file into the
            # daemon for its [daemon.hub_export] api_key_file. Both sides trim,
            # so a trailing newline cannot desync the two halves.
            - name: Hub__Sources__0__ImportApiKey
              valueFrom:
                secretKeyRef:
                  name: perf-sentinel-hub-import-key
                  key: import-key
            # The header value that goes with AuthHeaderName above, sent on
            # every request this source is polled with, and the only way the
            # Hub gets past the gate on the daemon's GET /api/incidents. This
            # is the daemon's READ key, never its incidents write key: nothing
            # that only reads should be able to post an incident. The
            # HubOptionsValidator refuses a header name without a value, so
            # the Secret is not optional here either.
            - name: Hub__Sources__0__AuthHeaderValue
              valueFrom:
                secretKeyRef:
                  name: perf-sentinel-api-keys
                  key: read-api-key
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
            - name: data
              mountPath: /data
            # The rootfs is read-only; ASP.NET Core still wants a writable
            # temp directory.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # /health/ready flips only once the schema migration transaction has
          # committed, so the startup probe is what covers first-boot migration.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: perf-sentinel-hub-config
            items:
              - key: appsettings.Production.json
                path: appsettings.Production.json
        - name: data
          persistentVolumeClaim:
            claimName: perf-sentinel-hub-data
        - name: tmp
          emptyDir: {}
# No ServiceMonitor: with no Hub:MetricsPort set, the Hub answers /metrics on
# 8080 beside its API, but nothing scrapes it here. Scenarios assert on
# its HTTP API, its structured logs (event ids 1001, 1101-1103, 1201, 1301) and
# the SQLite file itself.
