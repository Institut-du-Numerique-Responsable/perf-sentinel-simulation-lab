---
# Redfish mock for the lab. Real BMC hardware (Dell iDRAC, HPE iLO,
# OpenBMC) is not available in CI nor on the local Apple Silicon dev
# rig. This Python stdlib mock stands in for two chassis controllers
# and exposes BOTH Redfish schemas the v0.7.6 daemon dispatches on:
#   - chassis-1: /redfish/v1/Chassis/1/Power (legacy_power schema,
#     parser reads /PowerControl/0/PowerConsumedWatts)
#   - chassis-2: /redfish/v1/Chassis/2/EnvironmentMetrics
#     (environment_metrics schema, parser reads /PowerWatts/Reading)
# Serving both lets the lab exercise the schema-dispatch logic
# introduced in v0.7.6 (cf perf-sentinel docs/CONFIGURATION.md
# section "[green.redfish]"). Stays HTTP-only: setting
# `ca_bundle_path` on the daemon side would cause the Redfish
# scraper to refuse to start because custom-CA TLS is not
# implemented.
#
# Port choice: 8000, not 8443 or 443. Real BMCs serve Redfish on 443
# (HTTPS) or occasionally 80 (HTTP). 8443 would mislead a reader into
# expecting TLS termination on the mock, 80 needs root or
# capabilities the non-root container does not have. 8000 is the
# Python convention for an unprivileged HTTP server and matches the
# mock's actual transport.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redfish-mock-script
  namespace: observability
  labels:
    app.kubernetes.io/name: redfish-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
data:
  app.py: |
    """Minimal Redfish mock exposing both schemas v0.7.6 dispatches on.

    chassis-1 serves the legacy /Power resource at
    /PowerControl/0/PowerConsumedWatts; chassis-2 serves the modern
    /EnvironmentMetrics resource at /PowerWatts/Reading. Two chassis
    IDs let the daemon exercise its multi-chassis fan-out, the
    per-service ops-proportional attribution, AND the schema
    dispatch wired in `RedfishSchema::{LegacyPower, EnvironmentMetrics}`.
    """
    import json
    import sys
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    STARTUP_EPOCH = time.time()


    def render_legacy_power(chassis_id, watts):
        return json.dumps({
            "@odata.id": f"/redfish/v1/Chassis/{chassis_id}/Power",
            "PowerControl": [
                {
                    "MemberId": "0",
                    "Name": f"chassis-{chassis_id}-power",
                    "PowerConsumedWatts": watts,
                }
            ],
        }).encode()


    def render_environment_metrics(chassis_id, watts):
        return json.dumps({
            "@odata.id": f"/redfish/v1/Chassis/{chassis_id}/EnvironmentMetrics",
            "PowerWatts": {
                "Reading": watts,
            },
        }).encode()


    # Fixture table: each entry pairs a Redfish path with the renderer
    # that produces the schema served at that path, the chassis id and
    # the wattage value. Adding a new fixture (extra chassis or extra
    # schema) is a single-row append.
    FIXTURES = {
        "/redfish/v1/Chassis/1/Power":              (render_legacy_power,       "1", 250.5),
        "/redfish/v1/Chassis/2/EnvironmentMetrics": (render_environment_metrics, "2", 180.0),
    }


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            fixture = FIXTURES.get(self.path)
            if fixture is not None:
                renderer, chassis_id, watts = fixture
                body = renderer(chassis_id, watts)
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            if self.path == "/healthz":
                uptime = int(time.time() - STARTUP_EPOCH)
                body = f"ok uptime={uptime}s\n".encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            self.send_error(404, "Not Found")

        def log_message(self, fmt, *args):
            sys.stderr.write(f"{self.address_string()} {fmt % args}\n")


    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: redfish-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: redfish-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redfish-mock
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redfish-mock
  namespace: observability
  labels:
    app.kubernetes.io/name: redfish-mock
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redfish-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redfish-mock
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72  # 3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/scripts/app.py"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: script
          configMap:
            name: redfish-mock-script
            items:
              - key: app.py
                path: app.py
