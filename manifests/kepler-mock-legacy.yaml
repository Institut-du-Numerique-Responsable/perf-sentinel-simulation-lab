---
# Kepler mock variant exposing the PRE-v0.10 legacy metric name
# (`kepler_container_joules_total`, without the `_cpu_` infix). Kept
# as a negative fixture for the daemon's zero-sample safety net
# introduced in v0.7.5 (cf
# `crates/sentinel-core/src/score/kepler/scraper.rs:28` for the
# `ZERO_SAMPLE_WARN_THRESHOLD = 3` constant and lines 263-285 for the
# warn-once gate): when the lab daemon, configured for the v0.10+
# name `kepler_container_cpu_joules_total`, scrapes this legacy mock
# it observes 200 OK but matches zero samples and logs the
# actionable warn at T+15s (3 ticks × 5s).
#
# Not deployed by default. Opt-in for the scenario that asserts the
# warn fires correctly when a cluster runs a pre-v0.10 Kepler
# exporter. Deploy alongside (not replacing) the canonical
# `kepler-mock.yaml`: this variant uses its own Service/Deployment
# names (`kepler-mock-legacy`) so the two can coexist, and a
# scenario that wants to exercise the safety net repoints the
# daemon's `[green.kepler].endpoint` ConfigMap to
# `kepler-mock-legacy.observability.svc.cluster.local:9102`. The
# accompanying NetworkPolicy ingress shipped in this same manifest
# lets the daemon reach the legacy pod through the namespace's
# default-deny-all (mirrors the pattern of
# `manifests/kepler-exporter.yaml` for the real opt-in exporter).
#
# Apply with:  kubectl apply -f manifests/kepler-mock-legacy.yaml
# Remove with: kubectl delete -f manifests/kepler-mock-legacy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kepler-mock-legacy-script
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock-legacy
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
data:
  app.py: |
    """Pre-v0.10 Kepler mock, legacy metric name only.

    Same counter semantics as `kepler-mock.yaml` (cumulative joules
    per container_name, advanced by a background thread on a wall-
    clock cadence independent of HTTP scrape rate). Differs only by
    the metric name emitted: `kepler_container_joules_total`, without
    the `_cpu_` infix that Kepler v0.10 introduced. A daemon
    configured for the v0.10+ name will scrape this mock 200 OK and
    match zero samples, triggering the zero-sample warn-once after
    `ZERO_SAMPLE_WARN_THRESHOLD = 3` consecutive empty ticks.
    """
    import sys
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TICK_INTERVAL_SEC = 5

    CONTAINERS = [
        ("order-svc", 12.0),
        ("payment-svc", 18.0),
        ("notification-svc", 7.0),
    ]

    STARTUP_EPOCH = time.time()
    COUNTERS = {name: 0.0 for name, _ in CONTAINERS}
    COUNTERS_LOCK = threading.Lock()


    def tick_loop():
        while True:
            time.sleep(TICK_INTERVAL_SEC)
            with COUNTERS_LOCK:
                for name, delta in CONTAINERS:
                    COUNTERS[name] += delta


    def snapshot_counters():
        with COUNTERS_LOCK:
            return dict(COUNTERS)


    def render_metrics():
        snapshot = snapshot_counters()
        lines = [
            "# HELP kepler_container_joules_total Cumulative joules per container - mocked (legacy pre-v0.10 name)",
            "# TYPE kepler_container_joules_total counter",
        ]
        for name, _ in CONTAINERS:
            lines.append(
                f'kepler_container_joules_total{{container_name="{name}"}} {snapshot[name]:.1f}'
            )
        return "\n".join(lines) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                body = render_metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/healthz":
                uptime = int(time.time() - STARTUP_EPOCH)
                body = f"ok uptime={uptime}s\n".encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_error(404, "Not Found")

        def log_message(self, fmt, *args):
            sys.stderr.write(f"{self.address_string()} {fmt % args}\n")


    if __name__ == "__main__":
        threading.Thread(target=tick_loop, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 9102), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: kepler-mock-legacy
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock-legacy
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kepler-mock-legacy
  ports:
    - name: http
      port: 9102
      targetPort: 9102
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kepler-mock-legacy
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock-legacy
    app.kubernetes.io/part-of: perf-sentinel-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler-mock-legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kepler-mock-legacy
        app.kubernetes.io/part-of: perf-sentinel-lab
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72  # 3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/scripts/app.py"]
          ports:
            - name: http
              containerPort: 9102
              protocol: TCP
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: script
          configMap:
            name: kepler-mock-legacy-script
            items:
              - key: app.py
                path: app.py
---
# Symmetric ingress on the legacy mock pod, locked down to the
# perf-sentinel daemon in the same namespace. Colocated with the
# Deployment so applying the opt-in fixture creates both at once.
# `manifests/network-policies.yaml` does not need to know about
# this variant. Mirrors the pattern of
# `manifests/kepler-exporter.yaml`'s `kepler-exporter-allow-daemon`
# policy for the real upstream exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kepler-mock-legacy-allow-daemon
  namespace: observability
  labels:
    app.kubernetes.io/name: kepler-mock-legacy
    app.kubernetes.io/part-of: perf-sentinel-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kepler-mock-legacy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: perf-sentinel-daemon
      ports:
        - protocol: TCP
          port: 9102
