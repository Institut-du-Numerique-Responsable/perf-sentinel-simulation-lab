name: validate lab on perf-sentinel release

on:
  repository_dispatch:
    types: [perf-sentinel-released]
  workflow_dispatch:
    inputs:
      perf_sentinel_version:
        description: 'perf-sentinel version to validate (default: latest)'
        required: false
        default: 'latest'
        type: string
  # No schedule: the daily 02:00 UTC cron was retired on 2026-07-13 -
  # validation now runs only on release dispatch or manually.

permissions:
  contents: read
# `issues: write` is NOT granted here. Only notify-on-failure opens an issue
# and it declares the permission on itself, so granting it workflow-wide gave
# every other job a write token it never uses.

concurrency:
  group: lab-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PERF_SENTINEL_VERSION: >-
        ${{ github.event.client_payload.version
            || github.event.inputs.perf_sentinel_version
            || 'latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Show resolved version
        run: |
          echo "PERF_SENTINEL_VERSION=${PERF_SENTINEL_VERSION}"
          echo "Trigger: ${{ github.event_name }}"

      - name: Install k3d
        env:
          K3D_TAG: v5.9.0
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_TAG}/install.sh" \
                | TAG="${K3D_TAG}" bash; then
              break
            fi
            echo "k3d install attempt ${attempt} failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          k3d version

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          # Pin the Helm runtime explicitly (v4): otherwise setup-helm can
          # fall back to an older implicit default when its release fetcher
          # fails (warning observed during 0.5.18 validation run). The lab's
          # helm usage (repo add/update, upgrade --install --wait/--set-file,
          # status, uninstall, lint) is verified compatible with v4.
          version: 'v4.3.0'

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0

      - name: Add helm repos used by make validate
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Patch perf-sentinel image to validated version
        run: |
          # The baseline manifest pins the image by digest for supply-chain.
          # When validating an arbitrary upstream version (or the `latest`
          # dispatch default) we drop the digest and revert to a tag pin: the
          # validated version is the unit of interest, not the digest of a
          # yet-untested image. Firing unconditionally also keeps the default
          # path working when the manifest is digest-pinned.
          sed -i -E "s|ghcr.io/institut-du-numerique-responsable/perf-sentinel(@sha256:[a-f0-9]+\|:[0-9.]+)|ghcr.io/institut-du-numerique-responsable/perf-sentinel:${PERF_SENTINEL_VERSION}|g" \
            manifests/perf-sentinel-daemon.yaml
          grep "ghcr.io/institut-du-numerique-responsable/perf-sentinel" manifests/perf-sentinel-daemon.yaml

      - name: Provision Electricity Maps token file from repo secret
        env:
          EM_TOKEN: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}
        run: |
          if [ -z "${EM_TOKEN}" ]; then
            echo "::error::ELECTRICITY_MAPS_TOKEN repo secret is empty. Set it via: gh secret set ELECTRICITY_MAPS_TOKEN"
            exit 1
          fi
          printf '%s' "${EM_TOKEN}" > .electricity-maps-token
          chmod 600 .electricity-maps-token

      - name: make validate (offline)
        run: make validate

      - name: Free up runner disk space (k3d import duplicates images per node)
        run: |
          echo "disk before:"; df -h / | tail -1
          # The 3 Java images build in Docker, then k3d import copies each into
          # every node's containerd. On top of the observability stack this can
          # cross the kubelet DiskPressure threshold and evict postgres/grafana,
          # leaving order-service Pending until helm --wait times out (issue #33).
          # Reclaim preinstalled SDKs first; keep /opt/hostedtoolcache (helm/kubectl).
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "disk after:"; df -h / | tail -1

      - name: make up-cni (k3d + Cilium + observability + daemon)
        run: |
          make up-cni
          kubectl get nodes
          kubectl get pods -A

      - name: make seed-services (Java services + traffic stack)
        run: make seed-services

      - name: make seed-electricity-maps
        run: make seed-electricity-maps

      - name: make validate-findings (12/12 anti-patterns)
        # Background kubectl port-forwards spawned by make up-cni survive
        # in the runner container but the seed-electricity-maps daemon
        # rollout leaves them in a zombie state holding the local port.
        # Force-kill them, drop the stale pid files, then re-spawn fresh
        # tunnels and poll the daemon HTTP /api/status until it answers.
        run: |
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid
          sleep 2
          ./scripts/port-forward.sh start
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:14318/api/status >/dev/null 2>&1; then
              echo "daemon reachable after ${i}s"
              break
            fi
            sleep 1
          done
          make validate-findings

      - name: make verify-electricity-maps (EM scoring)
        run: |
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid
          sleep 2
          ./scripts/port-forward.sh start
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:14318/api/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          make verify-electricity-maps

      - name: make verify-network-policies (assertion 4 SKIPPED, GitLab CE out of CI scope)
        run: |
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid
          sleep 2
          ./scripts/port-forward.sh start
          kubectl -n observability port-forward svc/kube-prometheus-stack-prometheus 9090:9090 \
            > /tmp/pf-prom.log 2>&1 &
          for _ in $(seq 1 60); do
            daemon_ok=$(curl -fsS http://localhost:14318/api/status >/dev/null 2>&1 && echo y || echo n)
            prom_ok=$(curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1 && echo y || echo n)
            if [ "${daemon_ok}" = "y" ] && [ "${prom_ok}" = "y" ]; then
              break
            fi
            sleep 1
          done
          ./scripts/verify-network-policies.sh

      # Deployment-mode scenarios (8 total, all PASS locally) are not wired
      # into this workflow yet. They require additional cluster footprint
      # (Jaeger, Zipkin, dedicated daemons, sidecars) that exceeds GHA
      # runner capacity. See docs/SCENARIOS.md for the adoption guide and
      # `make verify-all-scenarios` for the local meta-target.

      # B1 CI/CD integration scenarios. ci-shift-left runs first because
      # output-formats-coverage reuses its artefacts under
      # /tmp/ci-shift-left/. The 3 templates (gitlab-ci, jenkinsfile,
      # github-actions) stay local-only: gitlab-ci needs the heavy
      # GitLab CE deployment, jenkinsfile-runner is flaky in hosted
      # runners, and act-in-act is convolu.
      - name: B1 verify-ci-shift-left (primary, ack workflow)
        run: |
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid
          sleep 2
          ./scripts/port-forward.sh start
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:14318/api/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          make verify-ci-shift-left

      - name: B1 verify-output-formats-coverage (depends on ci-shift-left)
        run: make verify-output-formats-coverage

      - name: B1 verify-disclose (two-tier waste, CLI-only)
        # disclose is offline (no daemon/cluster contact). Runs against the
        # release binary (inherits the job PERF_SENTINEL_VERSION) so it follows
        # the current two-tier waste + report-schema behavior, not a frozen
        # historical version. NOTE: the fixture org-config pins
        # specpower_table_version to the binary's embedded CCF vintage. Bump it
        # (scenarios/disclose/fixtures/org-config.toml) when the vintage changes.
        run: make verify-disclose

      - name: B1 verify-disclose-temporal (disclosure continuity, CLI-only)
        # Same offline pattern as verify-disclose, also following the release
        # binary. Locks the temporal_coverage / coverage_basis continuity fields
        # against the current schema. Same org-config CCF-vintage caveat.
        run: make verify-disclose-temporal

      - name: B1 verify-daemon-sigterm-drain (0.8.5 graceful drain-on-SIGTERM)
        # Proves the v0.8.5 contract: a graceful SIGTERM (scale-down) drains the
        # in-flight streaming window through detection (positive control), while an
        # ungraceful SIGKILL loses it (negative control). The scenario raises
        # trace_ttl_ms via a scoped ConfigMap and points the daemon at the image
        # under test, restoring the committed daemon on cleanup. The drain landed
        # in 0.8.5, so on an earlier daemon the positive control FAILs by design.
        # SIGKILL uses `docker exec <node> kill -9` against the k3d node containerd.
        #
        # Gated off the floating 'latest' tag (the default for workflow_dispatch
        # without an explicit version). 'latest' can point at
        # a pre-0.8.5 image that does not drain on SIGTERM, which would fail the
        # positive control by design and turn the run red. Explicit release
        # validations (repository_dispatch with the released version) are always
        # >= 0.8.5, so they run.
        if: env.PERF_SENTINEL_VERSION != 'latest'
        run: |
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid
          sleep 2
          ./scripts/port-forward.sh start
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:14318/api/status >/dev/null 2>&1 && break
            sleep 1
          done
          SIGTERM_DRAIN_IMAGE="ghcr.io/institut-du-numerique-responsable/perf-sentinel:${PERF_SENTINEL_VERSION}" make verify-daemon-sigterm-drain

      - name: B1 templates (LOCAL ONLY, surface as notices)
        # Notices instead of warnings: these 3 scenarios are
        # intentionally local-only (GitLab CE RAM, jenkinsfile-runner
        # flakiness, act-in-act recursion). Surfacing them as warnings
        # promoted them to the orange annotation strip on every clean
        # run, drowning real warnings. Documented in docs/SCENARIOS.md.
        run: |
          echo "::notice::template-gitlab-ci skipped in CI (GitLab CE RAM constraint), run 'make verify-template-gitlab-ci' locally"
          echo "::notice::template-jenkinsfile skipped in CI (jenkinsfile-runner flaky in hosted env), run 'make verify-template-jenkinsfile' locally"
          echo "::notice::template-github-actions skipped in CI (act-in-act convolu), run 'make verify-template-github-actions' locally"

      - name: Show daemon logs (debug)
        if: always()
        run: |
          kubectl -n observability logs deploy/perf-sentinel-daemon --tail=200 || true

      - name: Show pod overview (debug)
        if: always()
        run: kubectl get pods -A || true

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lab-validation-logs-${{ env.PERF_SENTINEL_VERSION }}-${{ github.run_id }}
          path: |
            tmp/*.log
            tmp/*.md
            /tmp/perf-sentinel-simulation-lab-*.md
            /tmp/scenario-ci-shift-left-report.md
            /tmp/scenario-output-formats-coverage-report.md
            /tmp/ci-shift-left/
            /tmp/output-formats-coverage/
          retention-days: 14
          if-no-files-found: warn

  validate-scenarios:
    needs: validate
    if: success()
    runs-on: ubuntu-latest
    # +30 over the pre-dashboard 45: the added scenarios cost ~16 min
    # (correlation-finding self-seeds a full ~9-min validate-findings), and
    # make up-cni's Cilium image pull has no per-step cap, so keep slack for
    # slow-runner variance: the job-level cap is a single wall-clock kill.
    timeout-minutes: 75
    permissions:
      contents: read

    env:
      PERF_SENTINEL_VERSION: >-
        ${{ github.event.client_payload.version
            || github.event.inputs.perf_sentinel_version
            || 'latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install k3d
        env:
          K3D_TAG: v5.9.0
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_TAG}/install.sh" \
                | TAG="${K3D_TAG}" bash; then
              break
            fi
            echo "k3d install attempt ${attempt} failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          k3d version

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: 'v4.3.0'

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0

      - name: Add helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Patch perf-sentinel image to validated version
        if: env.PERF_SENTINEL_VERSION != 'latest'
        run: |
          sed -i -E "s|ghcr.io/institut-du-numerique-responsable/perf-sentinel(@sha256:[a-f0-9]+\|:[0-9.]+)|ghcr.io/institut-du-numerique-responsable/perf-sentinel:${PERF_SENTINEL_VERSION}|g" \
            manifests/perf-sentinel-daemon.yaml

      - name: Provision Electricity Maps token
        env:
          EM_TOKEN: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}
        run: |
          if [ -z "${EM_TOKEN}" ]; then
            echo "::error::ELECTRICITY_MAPS_TOKEN repo secret is empty."
            exit 1
          fi
          printf '%s' "${EM_TOKEN}" > .electricity-maps-token
          chmod 600 .electricity-maps-token

      - name: Free up runner disk space (k3d import duplicates images per node)
        run: |
          echo "disk before:"; df -h / | tail -1
          # The 3 Java images build in Docker, then k3d import copies each into
          # every node's containerd. On top of the observability stack this can
          # cross the kubelet DiskPressure threshold and evict postgres/grafana,
          # leaving order-service Pending until helm --wait times out (issue #33).
          # Reclaim preinstalled SDKs first; keep /opt/hostedtoolcache (helm/kubectl).
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "disk after:"; df -h / | tail -1

      - name: make up-cni (k3d + Cilium + observability + daemon)
        run: |
          make up-cni
          kubectl get nodes
          kubectl get pods -A

      - name: make seed-services
        run: make seed-services

      - name: make seed-electricity-maps
        run: make seed-electricity-maps

      - name: Bring port-forward back up
        # The seed-electricity-maps daemon rollout leaves the original
        # port-forward in a zombie state. Force-kill, drop pid files,
        # respawn, and poll /api/status until reachable.
        run: |
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid
          sleep 2
          ./scripts/port-forward.sh start
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:14318/api/status >/dev/null 2>&1; then
              echo "daemon reachable after ${i}s"
              break
            fi
            sleep 1
          done

      # Daemon dashboard non-regression (see also correlation-finding and
      # hybrid-daemon-batch after the energy tail. daemon-ack-workflow covers
      # the ack tab). query-monitor-api is daemon-only and traffic-free, so it
      # runs first to fail fast on a /api/config, /api/status, /api/energy or
      # /metrics-gauge regression instead of after ~30 min of traffic steps.
      - name: query-monitor-api
        timeout-minutes: 4
        run: make verify-query-monitor-api

      - name: multi-agent-load (smoke 10 producers)
        timeout-minutes: 8
        run: PRODUCERS=10 RATE_PER_PRODUCER=100 DURATION=60s make verify-multi-agent-load

      - name: long-running-drift (5 min harness smoke)
        timeout-minutes: 10
        # CI runs a 5-minute smoke (DURATION_HOURS=0.083 ~= 5 min, 10
        # samples). Real drift detection is local-only via the 2h
        # default or LONG_RUN=1 for 24h.
        run: DURATION_HOURS=0.083 SAMPLE_INTERVAL=30 TRAFFIC_MULTIPLIER=5 make verify-long-running-drift

      - name: failure-mode-daemon-restart
        timeout-minutes: 6
        run: make verify-failure-mode-daemon-restart

      - name: failure-mode-backend-down
        timeout-minutes: 8
        run: make verify-failure-mode-backend-down

      - name: failure-mode-network-partition
        timeout-minutes: 5
        run: make verify-failure-mode-network-partition

      - name: cold-start-edge-cases
        timeout-minutes: 12
        run: make verify-cold-start-edge-cases

      - name: daemon-ack-workflow
        # The Makefile target re-seeds findings before running the
        # scenario (validate-findings.sh, ~9 min in CI), then the
        # scenario itself (~3 min). Total ~12 min plus margin.
        timeout-minutes: 18
        run: make verify-daemon-ack-workflow

      - name: scaphandre-mock-validation
        timeout-minutes: 4
        run: make verify-scaphandre-mock-validation

      - name: measured-energy-chain
        # 7.B polls the redfish-mock for up to 75s waiting for the
        # 60s-interval scrape to land at least once on each chassis.
        # 3 min covers the worst case plus startup jitter.
        timeout-minutes: 3
        run: make verify-measured-energy-chain

      # Traffic-dependent dashboard scenarios run last so their heavy seed
      # does not push the cheaper, previously-stable energy tail above past
      # the job timeout. correlation-finding self-seeds chatty+fanout traffic.
      # hybrid-daemon-batch then renders the daemon's fully-accumulated Report
      # via `report --input` using the version under test.
      - name: correlation-finding
        # Self-seeds chatty+fanout traffic via validate-findings (~9 min),
        # then waits 90s for the correlator window before asserting
        # /api/correlations.
        timeout-minutes: 16
        run: make verify-correlation-finding

      - name: hybrid-daemon-batch
        # Renders the daemon's accumulated Report as a self-contained HTML
        # dashboard via report --input (PERF_SENTINEL_VERSION-pinned render).
        timeout-minutes: 5
        run: make verify-hybrid-daemon-batch

      - name: Show daemon logs (debug)
        if: always()
        run: |
          kubectl -n observability logs deploy/perf-sentinel-daemon --tail=200 || true

      - name: Show pod overview (debug)
        if: always()
        run: kubectl get pods -A || true

      - name: Upload scenario reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scenarios-reports-${{ env.PERF_SENTINEL_VERSION }}-${{ github.run_id }}
          path: |
            /tmp/scenario-multi-agent-load-report.md
            /tmp/scenario-long-running-drift-report.md
            /tmp/scenario-failure-mode-daemon-restart-report.md
            /tmp/scenario-failure-mode-backend-down-report.md
            /tmp/scenario-failure-mode-network-partition-report.md
            /tmp/scenario-cold-start-edge-cases-report.md
            /tmp/scenario-daemon-ack-workflow-report.md
            /tmp/scenario-scaphandre-mock-validation-report.md
            /tmp/scenario-measured-energy-chain-report.md
            /tmp/scenario-query-monitor-api-report.md
            /tmp/scenario-correlation-finding-report.md
            /tmp/scenario-hybrid-daemon-batch-report.md
            /tmp/multi-agent-load/*
            /tmp/long-running-drift/*
            /tmp/failure-mode-*/*
            /tmp/cold-start-edge-cases/*
            /tmp/daemon-ack-workflow/*
            /tmp/scaphandre-mock-validation/*
            /tmp/measured-energy-chain/*
            /tmp/query-monitor-api/*
            /tmp/correlation-finding/*
            /tmp/hybrid-daemon-batch/*
          retention-days: 14
          if-no-files-found: warn

  validate-multistack:
    needs: validate
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      PERF_SENTINEL_VERSION: >-
        ${{ github.event.client_payload.version
            || github.event.inputs.perf_sentinel_version
            || 'latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install k3d
        env:
          K3D_TAG: v5.9.0
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_TAG}/install.sh" \
                | TAG="${K3D_TAG}" bash; then
              break
            fi
            echo "k3d install attempt ${attempt} failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          k3d version

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: 'v4.3.0'

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0

      - name: Add helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Patch perf-sentinel image to validated version
        run: |
          sed -i -E "s|ghcr.io/institut-du-numerique-responsable/perf-sentinel(@sha256:[a-f0-9]+\|:[0-9.]+)|ghcr.io/institut-du-numerique-responsable/perf-sentinel:${PERF_SENTINEL_VERSION}|g" \
            manifests/perf-sentinel-daemon.yaml

      - name: Provision Electricity Maps token
        env:
          EM_TOKEN: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}
        run: |
          if [ -z "${EM_TOKEN}" ]; then
            echo "::error::ELECTRICITY_MAPS_TOKEN repo secret is empty."
            exit 1
          fi
          printf '%s' "${EM_TOKEN}" > .electricity-maps-token
          chmod 600 .electricity-maps-token

      - name: Free up runner disk space (multistack builds 15 images)
        run: |
          echo "disk before:"; df -h / | tail -1
          # Service images build inside Docker, so the runner's preinstalled
          # language SDKs are dead weight. Reclaiming them before the cluster
          # and the 15 image builds avoids the node disk-pressure eviction storm
          # that aborted seeding (postgres + grafana evicted, go-svc left Pending).
          # Keep /opt/hostedtoolcache (helm + kubectl live there); only drop CodeQL.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "disk after:"; df -h / | tail -1

      - name: make up-cni (k3d + Cilium + observability + daemon)
        run: |
          make up-cni
          kubectl get nodes
          kubectl get pods -A

      - name: Create multistack Postgres schemas and roles
        run: |
          kubectl apply -f manifests/postgres-multistack-schemas.yaml
          kubectl -n db wait --for=condition=Complete job/postgres-multistack-schemas --timeout=120s

      - name: Seed multistack services (build + import all 15, leave scaled down)
        run: |
          set -euo pipefail
          for stack in quarkus mutiny helidon-se helidon-mp ktor django fastapi laravel symfony diesel seaorm rails nest dotnet go; do
            echo "::group::seed-${stack}-svc"
            make "seed-${stack}-svc"
            kubectl -n shop scale "deployment/${stack}-svc" --replicas=0
            kubectl -n shop wait --for=delete pod \
              -l "app.kubernetes.io/name=${stack}-svc" --timeout=120s
            echo "::endgroup::"
          done
          kubectl get pods -n shop

      - name: Bring port-forward up
        run: |
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid
          sleep 2
          ./scripts/port-forward.sh start
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:14318/api/status >/dev/null 2>&1; then
              echo "daemon reachable after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Validate multistack (15 stacks x 12 anti-patterns)
        run: |
          set -euo pipefail
          PASS=0; FAIL=0; RESULTS=""
          for stack in quarkus mutiny helidon-se helidon-mp ktor django fastapi laravel symfony diesel seaorm rails nest dotnet go; do
            echo "::group::${stack}-svc"
            kubectl -n shop scale "deployment/${stack}-svc" --replicas=1
            kubectl -n shop rollout status "deployment/${stack}-svc" --timeout=300s
            rm -f "tmp/validation-report-${stack}-svc.md"
            if ./scripts/run-multistack-scenario.sh "${stack}"; then
              scenario_status=PASS
            else
              scenario_status=FAIL
            fi
            score=$(tail -1 "tmp/validation-report-${stack}-svc.md" 2>/dev/null | grep -oE '[0-9]+ PASS' | grep -oE '^[0-9]+' || true)
            score=${score:-0}
            if ! [[ "${score}" =~ ^[0-9]+$ ]] || [ "${score}" -gt 12 ]; then
              score=0
            fi
            fails=$((12 - score))
            PASS=$((PASS + score))
            FAIL=$((FAIL + fails))
            RESULTS="${RESULTS}${stack}-svc: ${score}/12 (${fails} FAIL, runner ${scenario_status})\n"
            kubectl -n shop scale "deployment/${stack}-svc" --replicas=0
            kubectl -n shop wait --for=delete pod \
              -l "app.kubernetes.io/name=${stack}-svc" --timeout=120s
            echo "::endgroup::"
          done
          echo "========================================="
          echo "MULTISTACK VALIDATION SUMMARY"
          echo "========================================="
          printf '%b' "${RESULTS}"
          TOTAL=$((PASS + FAIL))
          echo "Total: ${PASS}/${TOTAL} (required: 180/180)"
          if [ "${PASS}" -ne 180 ] || [ "${FAIL}" -ne 0 ]; then
            echo "::error::multistack validation failed: ${PASS}/${TOTAL}, ${FAIL} failed"
            exit 1
          fi

      - name: Scale multistack services down and remove validation workloads
        if: always()
        run: |
          for stack in quarkus mutiny helidon-se helidon-mp ktor django fastapi laravel symfony diesel seaorm rails nest dotnet go; do
            kubectl -n shop scale "deployment/${stack}-svc" --replicas=0 2>/dev/null || true
          done
          kubectl -n shop get jobs -o name 2>/dev/null \
            | grep '^job.batch/k6-' \
            | xargs -r kubectl -n shop delete || true
          kubectl -n shop get configmaps -o name 2>/dev/null \
            | grep '^configmap/k6-' \
            | xargs -r kubectl -n shop delete || true
          pkill -f "kubectl.*port-forward" 2>/dev/null || true
          rm -f tmp/pf-*.pid

      - name: Show daemon logs (debug)
        if: always()
        run: |
          kubectl -n observability logs deploy/perf-sentinel-daemon --tail=200 || true

      - name: Show pod overview (debug)
        if: always()
        run: |
          kubectl get pods -A || true
          echo "=== node pressure conditions (disk/memory eviction?) ==="
          kubectl describe nodes | grep -E 'MemoryPressure|DiskPressure|PIDPressure|ephemeral-storage|Allocated resources' || true
          echo "=== evicted / failed pod reasons ==="
          kubectl get pods -A -o json 2>/dev/null | jq -r '.items[] | select(.status.phase=="Failed" or .status.reason=="Evicted") | "\(.metadata.namespace)/\(.metadata.name): \(.status.reason // .status.phase) — \(.status.message // "")"' | sort | uniq -c | sort -rn || true
          echo "=== runner disk ==="; df -h / | tail -1

      - name: Upload multistack reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: multistack-reports-${{ env.PERF_SENTINEL_VERSION }}-${{ github.run_id }}
          path: |
            tmp/validation-report-*-svc.md
            tmp/import-*.log
          retention-days: 14
          if-no-files-found: warn

  notify-on-failure:
    needs: [validate, validate-multistack, validate-scenarios]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    env:
      PERF_SENTINEL_VERSION: >-
        ${{ github.event.client_payload.version
            || github.event.inputs.perf_sentinel_version
            || 'latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create or update regression issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const version = process.env.PERF_SENTINEL_VERSION || 'unknown';
            const trigger = context.eventName;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `lab validation failed for perf-sentinel ${version}`;
            const body = [
              `Lab validation workflow failed for perf-sentinel version \`${version}\`.`,
              ``,
              `**Trigger**: ${trigger}`,
              `**Run**: ${runUrl}`,
              `**Tag perf-sentinel**: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/releases/tag/v${version}`,
              ``,
              `If the failed step is **make validate (offline)**, this is lab-side drift, not an upstream regression: it runs before \`make up-cni\` and never contacts perf-sentinel.`,
              ``,
              `Check the run logs for the failed step. Common causes:`,
              ``,
              `- Upstream regression on \`/metrics\` format, \`/api/export/report\`, or ingest path`,
              `- Environment drift: Helm chart bump that changed labels or selectors`,
              `- Lab fixture obsolete after a stack bump`,
              ``,
              `<details><summary>Reproduction locale</summary>`,
              ``,
              '```bash',
              `cd ~/IdeaProjects/perf-sentinel-simulation-lab`,
              `make validate  # offline gate, no cluster: rule this out first`,
              `# Patch perf-sentinel image to ${version}`,
              `sed -i '' "s|ghcr.io/institut-du-numerique-responsable/perf-sentinel:[0-9.]*|ghcr.io/institut-du-numerique-responsable/perf-sentinel:${version}|g" manifests/perf-sentinel-daemon.yaml`,
              `make reset-cni  # ou make up-cni si pas de cluster`,
              `make seed-services && make seed-electricity-maps`,
              `make validate-findings`,
              `make verify-electricity-maps`,
              `make verify-network-policies`,
              '```',
              ``,
              `</details>`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'automation,regression',
              state: 'open',
            });
            const dup = existing.data.find(i => i.title === title);

            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Re-occurrence: ${runUrl}`,
              });
              console.log(`Commented on existing issue #${dup.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation', 'regression'],
                assignees: ['robintra'],
              });
              console.log(`Created new issue: ${title}`);
            }
